<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101a30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Voyage — v83 Web Client</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="hud" class="offline-only">
      <div><span class="value" id="hud-map">-</span> <span class="label">(<span id="hud-id">-</span>)</span></div>
      <form id="map-form"><input id="map-input" placeholder="map id" inputmode="numeric"><button>Go</button></form>
    </div>
    <div id="loading-overlay">
      <p id="loading-text">Loading...</p>
    </div>
  </div>
  <div id="login-root"></div>
  <script type="module">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .catch((error) => console.error('Service worker registration failed:', error));
    }
  </script>
  <script type="module" src="/Voyage.js"></script>
</body>
</html>
